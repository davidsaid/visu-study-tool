<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VISU scenario harness</title>
<!-- Drives index.html inside an iframe for screenshots and the persistence check.
     Run in Chrome with --allow-file-access-from-files when opened from file://.
     Query: ?s=<scenario>&w=<iframe width>&h=<iframe height>  (see SCENARIOS below). -->
<style>
  html, body { margin: 0; background: #fff; }
  iframe { border: 0; display: block; margin: 0 auto; }
  #result { font: 12px monospace; white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>
<pre id="result">running</pre>
<script>
(async function () {
'use strict';
const Q = new URLSearchParams(location.search);
const scenario = Q.get('s') || 'today', W = +(Q.get('w') || 1440), H = +(Q.get('h') || 900);
const KEY = 'visu-progress-v1';
const out = document.getElementById('result');
const report = (o) => { out.textContent = JSON.stringify(o, null, 1); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
let frame, win, doc;

function seedStorage(obj) { if (obj === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, JSON.stringify(obj)); }
async function open(hash, query) {
  if (!frame) { frame = document.createElement('iframe'); frame.width = W; frame.height = H; frame.style.width = W + 'px'; frame.style.height = H + 'px'; document.body.prepend(frame); out.style.display = 'none'; }
  await new Promise(res => { frame.onload = res; frame.src = '../index.html' + (query || '') + '#' + (hash || 'hoy') + (frame.src && frame.src.includes('#' + hash) ? '' : ''); });
  win = frame.contentWindow; doc = win.document;
  await sleep(150);
}
async function go(hash) { win.location.hash = hash; await sleep(200); }
async function reload() { await new Promise(res => { frame.onload = res; win.location.reload(); }); win = frame.contentWindow; doc = win.document; await sleep(200); }
const $ = sel => doc.querySelector(sel);
async function click(sel) { const el = typeof sel === 'string' ? $(sel) : sel; if (!el) throw new Error('missing ' + sel); el.click(); await sleep(80); }
async function type(sel, text) { const el = $(sel); if (!el) throw new Error('missing ' + sel); el.value = text; el.dispatchEvent(new win.Event('input', { bubbles: true })); await sleep(30); }
const App = () => win.VISU_APP, Eng = () => win.VISU_ENGINE;
/* First look: one step forward; a "do you remember?" pause on the way is answered (first photo) and passed. */
async function lookNext() {
  if ($('#lqcheck')) { await click('[data-lqpick]'); await click('#lqcheck'); await click('#lqnext'); return; }
  await click('#looknext');
}
async function lookToEnd() { while ($('#looknext') || $('#lqcheck')) await lookNext(); }
const answer = (sp, skill) => Eng().answerFor(App().M, sp, skill);
const seen = { meta: { seenNotice: true } };

/* Answers the current typed card: 'right', 'wrong' or a literal string. */
async function answerTyped(what, conf) {
  const it = App().sessionState().items[App().sessionState().i];
  const text = what === 'right' ? answer(it.sp, it.skill) : what === 'wrong' ? 'zzzz' : what;
  await type('#typedin', text);
  doc.getElementById('typedform').requestSubmit(); await sleep(80);
  await click(`[data-conf="${conf || 'sure'}"]`);   // the confidence button is the check
  return it;
}
async function playSession(level, plan) {
  App().set().level = level; win.VISU_STORE.save();
  await go('nivel'); await click('[data-game="foto"]'); await click(`[data-level="${level}"]`); await click('#startbtn'); await sleep(150);
  for (const what of plan) { await answerTyped(what); await click('#nextbtn'); }
}
function setItem(sp, skill) { const s = App().sessionState(); s.items[s.i] = { sp, skill }; App().views.session(); }

const SCENARIOS = {
  'notice': async () => { seedStorage(null); await open('hoy'); },
  'today-empty': async () => { seedStorage(seen); await open('hoy'); },
  'nostore': async () => { seedStorage(null); await open('hoy', '?nostorage=1'); await click('#nt-ok'); },
  'today': async () => {
    seedStorage(seen); await open('hoy');
    await playSession(3, ['right', 'right', 'wrong', 'right', 'right', 'right', 'right', 'wrong']);
    await go('hoy');
    /* one confusion so the aside shows a pair */
    App().set().level = 3; await go('sesion'); setItem('milvus_milvus', 'common'); await answerTyped('Milano negro'); await go('hoy');
  },
  'nivel': async () => { seedStorage(seen); await open('nivel'); await click('[data-level="2"]'); },
  'question': async () => { seedStorage(seen); await open('hoy'); App().set().level = 2; await go('sesion'); setItem('buteo_buteo', 'common'); await type('#typedin', 'Busa'); await click('#hintbtn'); await click('#hintbtn'); },
  'mistake': async () => { seedStorage(seen); await open('hoy'); App().set().level = 3; await go('sesion'); setItem('milvus_milvus', 'common'); await answerTyped('Milano negro', 'sure'); },
  'misspelling': async () => { seedStorage(seen); await open('hoy'); App().set().level = 3; await go('sesion'); setItem('ciconia_ciconia', 'common'); await answerTyped('Cigueña blanca', 'sure'); },
  'cual': async () => { seedStorage(seen); await open('hoy'); App().set().level = 2; await go('cual-es'); await click(doc.querySelectorAll('[data-pick]')[1]); await click('[data-conf="unsure"]'); await sleep(+(Q.get('wait') || 0)); },
  'explore': async () => { seedStorage(seen); await open('explorar'); await go('grupo-class-Mammalia'); await click('.trow.kid[data-row="order:Carnivora"]'); await sleep(200); },
  'species': async () => { seedStorage(seen); await open('ficha-' + (Q.get('sp') || 'lynx_pardinus')); const h = doc.getElementById('card-m'); if (h && W < 1000) h.scrollIntoView(); },
  'group': async () => { seedStorage(seen); await open('grupo-order-Accipitriformes'); const h = doc.getElementById('card-m'); if (h && W < 1000) h.scrollIntoView(); },
  'easy': async () => {
    seedStorage(seen); await open('hoy'); App().set().level = 1; win.VISU_STORE.save();
    await go('nivel'); await click('[data-game="foto"]'); await click('[data-level="1"]'); await click('#startbtn'); await sleep(150);
    await click('.car [data-car-step="1"]'); await sleep(2500);
  },
  /* The photo carousel on the species card and at every level, in the mock too; flipping keeps typed answers. */
  'carousel': async () => {
    seedStorage(seen); await open('ficha-lynx_pardinus');
    const count = () => ($('.car .car-count') || {}).textContent, credit = () => ($('#gal-lynx_pardinus .credit') || {}).textContent, img = () => ($('.car img') || {}).getAttribute('src');
    const card = { start: count(), img0: img(), credit0: credit() };
    await click('.car [data-car-step="1"]');
    Object.assign(card, { afterNext: count(), img1: img(), creditChanged: credit() !== card.credit0, thumbPressed: [...doc.querySelectorAll('.gthumb')].map(b => b.getAttribute('aria-pressed')).join(','), focusOnNext: doc.activeElement && doc.activeElement.dataset.carStep });
    await click('.car [data-car-step="-1"]'); await click('.car [data-car-step="-1"]');
    card.wrapPrev = count();
    $('.car').dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true })); await sleep(80);
    card.arrowKey = count();
    await click('.gthumb[data-gal="2"]'); card.thumb2 = count();
    App().set().level = 1; win.VISU_STORE.save();
    await go('nivel'); await click('[data-game="foto"]'); await click('[data-level="1"]'); await click('#startbtn'); await sleep(150);
    /* A class or order question: a wrong pick there shows the photo screen (another species shows the comparison). */
    for (let k = 0; k < 50 && !['class', 'order'].includes(App().sessionState().items[0].skill); k++) App().newSession('foto', { force: true });
    App().views.session(); await sleep(100);
    const easy = { start: count() };
    await click('[data-opt="1"]'); easy.pickedKept = !!$('[data-opt="1"].picked');
    await click('.car [data-car-step="1"]');
    Object.assign(easy, { afterNext: count(), pickedStillKept: !!$('[data-opt="1"].picked'), creditHidden: /aparece al responder|appears after/.test(($('.session-wrap .credit') || {}).textContent || ''), alt: ($('.car img') || {}).alt, altHidesName: (() => { const s = App().sp(App().sessionState().items[App().sessionState().i].sp), a = ($('.car img') || {}).alt || ''; return !a.includes(s.binomial) && !a.includes(s.common_es); })() });
    const st = App().sessionState(), wrongOpt = st.mc.options.findIndex(o => o.value !== st.mc.correct);
    await click(`[data-opt="${wrongOpt}"]`); await click('[data-conf="sure"]');
    easy.mistakeScreen = !!$('.mistake-head'); easy.mistakeCount = count();
    await click('.car [data-car-step="1"]'); easy.mistakeAfterNext = count(); easy.mistakeStillShown = !!$('.mistake-head');
    await sleep(500); easy.imgLoaded = (img => !!img && img.complete && img.naturalWidth > 0)($('.car img'));
    App().set().level = 2; win.VISU_STORE.save();
    await go('nivel'); await click('[data-game="foto"]'); await click('[data-level="2"]'); await click('#startbtn'); await sleep(150);
    const medium = { carousel: !!$('.car'), photo: !!$('.quiz-photo img') };
    if (medium.carousel) {   /* flipping keeps what she typed */
      await type('#typedin', 'abc'); const before = $('.car .car-count').textContent;
      await click('.car [data-car-step="1"]');
      Object.assign(medium, { flipped: $('.car .car-count').textContent !== before, typedKept: ($('#typedin') || {}).value === 'abc' });
    }
    seedStorage({ meta: { seenNotice: true }, settings: { mockSize: 5 } }); await go('hoy'); await go('simulacro');
    const mock = { carousel: !!$('.car[data-car="mock"]') };
    if (mock.carousel && $('.car [data-car-step="1"]')) {
      await type('#f-class', 'Aves'); const before = $('.car .car-count').textContent;
      await click('.car [data-car-step="1"]');
      Object.assign(mock, { flipped: $('.car .car-count').textContent !== before, typedKept: ($('#f-class') || {}).value === 'Aves' });
    }
    report({ scenario: 'carousel', card, easy, medium, mock });
  },
  /* Quiz photos are drawn at random per question: counts per photo index over many draws. */
  'random': async () => {
    seedStorage(seen); await open('hoy');
    const tally = () => [0, 0, 0, 0];
    const session = tally(), mock = tally(), rev = tally();
    for (const lv of [2, 3]) {
      App().set().level = lv;
      for (let k = 0; k < 200; k++) { App().newSession('foto', { force: true }); session[App().sessionState().photoIdx]++; }
    }
    const lynx = tally(); for (let k = 0; k < 4000; k++) lynx[App().randomPhoto('lynx_pardinus')]++;
    const firstItems = new Set(); for (let k = 0; k < 30; k++) { App().newSession('foto', { force: true }); firstItems.add(App().photosOf(App().sessionState().items[0].sp).length); }
    await go('simulacro'); App().mockState().items.forEach(x => mock[x.photoIdx]++);
    for (let k = 0; k < 15; k++) { await go('hoy'); await go('cual-es'); const r = App().reverseState(); Object.values(r.photo).forEach(i => rev[i]++); }
    App().set().level = 3; await go('sesion');
    const before = App().sessionState().photoIdx; await click('[data-conf]').catch(() => {}); App().views.session();
    report({ scenario: 'random', lynx, photoCountsOfFirstItems: [...firstItems], session, mock, rev, stableOnRerender: App().sessionState().photoIdx === before });
  },
  /* Two collections (run on the site built by tests/fixture_site.py): switching keeps each one's progress apart. */
  'collections': async () => {
    localStorage.removeItem('visu-collection'); localStorage.removeItem(KEY + ':artropodos-prueba');
    seedStorage({ meta: { seenNotice: true }, settings: { lang: 'en' } }); await open('hoy');
    const snap = () => ({ col: win.VISU_COLLECTION, key: win.VISU_STORE.key, species: App().counts().species, root: App().M.root,
      lang: win.VISU_STORE.data.settings.lang, log: win.VISU_STORE.data.log.length, title: doc.title,
      brand: (doc.querySelector('.rail .brand small') || {}).textContent, switcher: doc.querySelectorAll('[data-col]').length });
    const switchTo = async id => { await go('ajustes'); const loaded = new Promise(res => { frame.onload = res; }); await click(`[data-col="${id}"]`); await loaded; win = frame.contentWindow; doc = win.document; await sleep(250); };
    await playSession(3, ['right']);
    await go('ajustes');
    const vert = snap();
    const vertCopy = JSON.stringify(Eng().makeExport(win.VISU_STORE.data, Date.now(), null, App().collection()));
    await switchTo('artropodos-prueba');
    await go('ajustes');
    const art = snap();
    const imported = App().importText(vertCopy), toast = (doc.getElementById('toast') || {}).textContent;
    await switchTo('vertebrados');
    await go('ajustes');
    const back = snap();
    report({ scenario: 'collections', vert, art, importOtherRefused: imported === false, toast, back,
      storedKeys: Object.keys(localStorage).filter(k => k.startsWith('visu-')).sort() });
  },
  /* The photo asked about stays on screen with its credit: wrong-species comparison, and mock results. */
  'credits': async () => {
    seedStorage({ meta: { seenNotice: true }, settings: { mockSize: 5 } }); await open('hoy');
    App().set().level = 3; await go('sesion'); setItem('milvus_milvus', 'common');
    const asked = App().photosOf('milvus_milvus')[App().sessionState().photoIdx % App().photosOf('milvus_milvus').length];
    await answerTyped('Milano negro');
    const fig = $('.twoup .correct');
    const compare = { shown: !!fig, sameFile: !!fig && fig.querySelector('img').getAttribute('src') === asked.file,
      credited: !!fig && (fig.querySelector('.credit') || {}).textContent.includes(asked.author || '') };
    await go('simulacro');
    const items = App().mockState().items.map(x => ({ sp: x.sp, ph: x.photoIdx }));
    for (let i = 0; i < 5; i++) { doc.getElementById('mockform').requestSubmit(); await sleep(150); }
    const lis = [...doc.querySelectorAll('.mock-list li')];
    const mock = { items: lis.length, credited: lis.filter(li => li.querySelector('.credit')).length,
      samePhotos: lis.every((li, i) => { const ps = App().photosOf(items[i].sp); return li.querySelector('img').getAttribute('src') === ps[items[i].ph % ps.length].file; }) };
    report({ scenario: 'credits', compare, mock });
  },
  'hard': async () => { seedStorage(seen); await open('hoy'); App().set().level = 3; win.VISU_STORE.save(); await go('nivel'); await click('[data-game="foto"]'); await click('[data-level="3"]'); await click('#startbtn'); await sleep(1500); },
  /* From a mistake to the animal's card and back to the same question (button, then browser back). */
  'cardlink': async () => {
    seedStorage(seen); await open('hoy'); App().set().level = 3; await go('sesion'); setItem('milvus_milvus', 'common');
    await answerTyped('Milano negro');
    const sessBefore = App().sessionState(), iBefore = sessBefore.i;
    const links = [...doc.querySelectorAll('.session-wrap a[href="#ficha-milvus_milvus"]')].length;
    const nameLink = !!doc.querySelector('.twoup .correct .vern a[href="#ficha-milvus_milvus"]');
    await click('.session-wrap .actions a[href="#ficha-milvus_milvus"]'); await sleep(250);
    const card = { onCard: location.hash === '' && doc.location.hash === '#ficha-milvus_milvus', back: !!doc.querySelector('.back-to-practice'),
      title: (doc.querySelector('.plate h1, .plate h2') || {}).textContent };
    await click('.back-to-practice'); await sleep(250);
    const s1 = App().sessionState();
    const viaButton = { sameSession: s1 === sessBefore, sameItem: s1.i === iBefore, stillFeedback: !!doc.querySelector('.mistake-head') };
    await click('.session-wrap .actions a[href="#ficha-milvus_milvus"]'); await sleep(250);
    win.history.back(); await sleep(400);
    const s2 = App().sessionState();
    const viaBrowserBack = { sameSession: s2 === sessBefore, sameItem: s2.i === iBefore, stillFeedback: !!doc.querySelector('.mistake-head') };
    await go('hoy'); await go('ficha-lynx_pardinus');
    const noBackLater = !doc.querySelector('.back-to-practice');
    report({ scenario: 'cardlink', links, nameLink, card, viaButton, viaBrowserBack, noBackLater });
  },
  /* "What the name says": on the species card, the group card, and after a miss, a misspelling and a wrong pick. */
  'names': async () => {
    seedStorage(seen); await open('ficha-milvus_milvus');
    const exp = (sp, k) => (App().nameMeaning(sp, k) || {}).text || '';
    const dd = [...doc.querySelectorAll('.names-dl dd')].map(d => d.textContent);
    const card = { rows: dd.length, matches: ['class', 'order', 'genus'].every(k => !exp('milvus_milvus', k) || dd.some(t => t.startsWith(exp('milvus_milvus', k)))) };
    await go('grupo-order-Accipitriformes');
    const gEt = (App().M.content.groups['order:Accipitriformes'] || {}).etymology;
    const groupShown = !!doc.querySelector('.plate .name-key') === !!gEt;
    await go('hoy'); App().set().level = 3; await go('sesion'); setItem('milvus_milvus', 'order'); await answerTyped('wrong');
    const keyText = () => (doc.querySelector('.session-wrap .name-key') || {}).textContent || '';
    const missOrder = !exp('milvus_milvus', 'order') || keyText().includes(exp('milvus_milvus', 'order'));
    await click('#nextbtn'); setItem('ciconia_ciconia', 'common'); await answerTyped('Cigueña blanca');
    const spelling = Array.from(doc.querySelectorAll('.spell mark.dl')).map(m => m.textContent).join('') === 'ü' && keyText().includes(exp('ciconia_ciconia', 'genus'));   // only the missing letter is marked
    await click('#nextbtn'); setItem('milvus_milvus', 'common'); await answerTyped('Milano negro');
    const wrongSpecies = !!doc.querySelector('.twoup') && keyText().includes(exp('milvus_milvus', 'genus')) && keyText().includes(exp('milvus_migrans', 'genus'));
    await click('#nextbtn'); setItem('scyliorhinus_canicula', 'class'); await answerTyped('wrong');
    const esClass = keyText().includes('Condrictios');
    await go('ficha-scyliorhinus_canicula');
    const esCard = (doc.querySelector('.exam5') || {}).textContent.includes('Condrictios') && (doc.querySelector('.names-dl') || {}).textContent.includes('Condrictios');
    await go('ficha-timon_lepidus');
    const esReptiles = (doc.querySelector('.exam5') || {}).textContent.includes('Reptiles');
    win.VISU_STORE.data.settings.lang = 'en'; win.VISU_STORE.save(); await reload(); await go('ficha-scyliorhinus_canicula');
    const noEsInEnglish = !(doc.querySelector('.exam5') || {}).textContent.includes('Condrictios');
    report({ scenario: 'names', card, groupShown, missOrder, spelling, wrongSpecies, esClass, esCard, esReptiles, noEsInEnglish });
  },
  /* Press "Load the YouTube video" on a card; screenshot to see the player (needs network). */
  'video': async () => { seedStorage(seen); await open('ficha-' + (Q.get('sp') || 'milvus_milvus')); const b = doc.querySelector('[data-video]'); if (b) { b.scrollIntoView(); b.click(); } await sleep(8000); const f = doc.querySelector('.video-box iframe'); if (f) f.scrollIntoView(); },
  /* Explorer study mode: the list's classes as roots, Reptilia included; the full tree is one tap away. */
  'studytree': async () => {
    seedStorage(seen); await open('explorar');
    const rows = () => [...doc.querySelectorAll('#tree .trow')].map(r => r.dataset.row);
    await click('[data-treemode="study"]');
    const roots = App().M.classRoots, top = rows();
    const onlyClasses = top.length === roots.length && top.every(r => roots.includes(r));
    await go('ficha-timon_lepidus'); const rep = rows();
    const reptileFromClass = rep[0] === roots[0] && rep.includes('class:Reptilia') && !rep.includes('clade:vertebrata') && !rep.includes('clade:sauropsida') && rep.includes('timon_lepidus');
    await go('grupo-class-Reptilia');
    const reptiliaCard = /Reptilia/.test((doc.querySelector('.plate h1') || {}).textContent || '') && !!doc.querySelector('.plate .grade-band');
    await reload(); const kept = !!doc.querySelector('[data-treemode="study"][aria-pressed="true"]');
    await go('ficha-timon_lepidus'); await click('[data-treemode="full"]');
    const full = rows().includes('clade:vertebrata') && !rows().includes('class:Reptilia');
    report({ scenario: 'studytree', onlyClasses, roots: roots.length, reptileFromClass, reptiliaCard, kept, full });
  },
  'studytree-shot': async () => { seedStorage({ meta: { seenNotice: true }, ui: { studyTree: true } }); await open(Q.get('at') || 'explorar'); await sleep(800); },
  'classmiss-shot': async () => { seedStorage(seen); await open('hoy'); App().set().level = 3; await go('sesion'); setItem(Q.get('sp') || 'scyliorhinus_canicula', 'class'); await answerTyped('wrong'); },
  /* ¿Cuál es?: every option flips through its photos; flipping neither picks nor loses the pick; alt text never names it. */
  'cualcar': async () => {
    seedStorage(seen); await open('hoy'); App().set().level = 2; await go('cual-es');
    const r = App().reverseState(), opts = r.opts.slice();
    const many = opts.findIndex(o => App().photosOf(o).length > 1);
    const before = r.photo[opts[many]];
    await click(doc.querySelectorAll('.rev-opt')[many].querySelector('[data-car-step="1"]'));
    const flipped = App().reverseState().photo[opts[many]] === (before + 1) % App().photosOf(opts[many]).length;
    const notPicked = !App().reverseState().picked;
    await click(doc.querySelectorAll('[data-pick]')[many]);
    const picked = App().reverseState().picked === opts[many];
    await click(doc.querySelectorAll('.rev-opt')[many].querySelector('[data-car-step="-1"]'));
    const pickKept = App().reverseState().picked === opts[many] && App().reverseState().photo[opts[many]] === before;
    /* a touch swipe flips the photo; the click the browser fires after it doesn't pick */
    const other = opts.findIndex((o, i) => i !== many && App().photosOf(o).length > 1), ob = App().reverseState().photo[opts[other]];
    const pb = doc.querySelectorAll('[data-pick]')[other], ev = (t, x) => pb.dispatchEvent(new win.PointerEvent(t, { bubbles: true, pointerType: 'touch', clientX: x, clientY: 100 }));
    ev('pointerdown', 200); ev('pointerup', 100); await sleep(50); const pb2 = doc.querySelectorAll('[data-pick]')[other]; pb2.click(); await sleep(80);
    const swipe = App().reverseState().photo[opts[other]] !== ob && App().reverseState().picked === opts[many];
    const carousels = doc.querySelectorAll('.rev-opt .car').length;
    const altHides = [...doc.querySelectorAll('.rev-opt img')].every((im, i) => !im.alt.includes(App().sp(opts[i]).binomial));
    await sleep(2000);
    const loaded = [...doc.querySelectorAll('.rev-opt img')].filter(im => im.complete && im.naturalWidth > 0).length;
    report({ scenario: 'cualcar', loaded, carousels, swipe, flipped, notPicked, picked, pickKept, altHides });
  },
  /* The side-by-side comparison after a wrong species: both photos flip, each with its own credit. */
  'comparecar': async () => {
    seedStorage(seen); await open('hoy'); App().set().level = 3; await go('sesion'); setItem('milvus_milvus', 'common'); await answerTyped('Milano negro');
    const figs = [...doc.querySelectorAll('.twoup figure')], cars = figs.map(f => f.querySelector('.car'));
    const cred = f => (f.querySelector('.car-credit') || {}).textContent, cnt = f => (f.querySelector('.car-count') || {}).textContent;
    const before = figs.map(f => [cnt(f), cred(f)]);
    await click(cars[0].querySelector('[data-car-step="1"]')); await click(cars[1].querySelector('[data-car-step="-1"]'));
    const flippedBoth = figs.every((f, i) => cnt(f) !== before[i][0]);
    const creditsFollow = figs.every((f, i) => cred(f) && cred(f) !== before[i][1]);
    const sameScreen = !!doc.querySelector('.mistake-head') && doc.querySelector('.twoup figure') === figs[0];
    report({ scenario: 'comparecar', carousels: cars.filter(Boolean).length, flippedBoth, creditsFollow, sameScreen });
  },
  /* After a wrong species, the two cards' field marks line up by body part: only parts both describe, yours left, the right one right. */

try {
